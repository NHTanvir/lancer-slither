[workspace]
resolver = "2"
members = [
    "crates/lancer-slither",
    "crates/slither-core",
    "crates/slither-ir",
    "crates/slither-detectors",
    "crates/slither-printers",
    "crates/crytic-compile-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-slither"
rust-version = "1.75"

[workspace.dependencies]
# Internal
slither-core = { path = "crates/slither-core" }
slither-ir = { path = "crates/slither-ir" }
slither-detectors = { path = "crates/slither-detectors" }
slither-printers = { path = "crates/slither-printers" }
crytic-compile-rs = { path = "crates/crytic-compile-rs" }

# External
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
color-eyre = "0.6"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
petgraph = "0.6"
rayon = "1"
regex = "1"
semver = { version = "1", features = ["serde"] }
tera = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
which = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
crossbeam-channel = "0.5"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
url = { version = "2", features = ["serde"] }
hex = "0.4"
tiny_http = "0.12"
dirs = "5"
directories = "5"
parking_lot = "0.12"
anyhow = "1"
ahash = "0.8"
tempfile = "3"

# GUI stack
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
egui_plot = "0.28"
rfd = "0.14"
arboard = "3"
egui-notify = "0.15"
muda = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
